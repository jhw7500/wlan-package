name: Gemini Auto PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR details
        id: pr-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_DIFF=$(gh pr diff $PR_NUMBER)
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"

          # Save to files for easier handling
          echo "$PR_DIFF" > pr_diff.txt
          echo "$PR_TITLE" > pr_title.txt
          echo "$PR_BODY" > pr_body.txt

      - name: Run Gemini Code Review
        id: gemini-review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Install dependencies
          pip install -q google-generativeai

          # Create Python script for Gemini review
          cat > gemini_review.py << 'PYTHON_EOF'
          import os
          import google.generativeai as genai

          # Configure Gemini
          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              print("ERROR: GEMINI_API_KEY not set")
              exit(1)

          genai.configure(api_key=api_key)
          model = genai.GenerativeModel('gemini-2.0-flash-exp')

          # Read PR details
          with open('pr_title.txt', 'r') as f:
              pr_title = f.read().strip()
          with open('pr_body.txt', 'r') as f:
              pr_body = f.read().strip()
          with open('pr_diff.txt', 'r') as f:
              pr_diff = f.read()

          # Create review prompt
          prompt = f"""Please review this pull request and provide constructive feedback.

          PR Title: {pr_title}

          PR Description:
          {pr_body}

          Code Changes:
          ```diff
          {pr_diff[:50000]}  # Limit to 50k chars to avoid token limits
          ```

          Please provide:
          1. Overall assessment
          2. Critical issues (security, bugs, breaking changes)
          3. Code quality suggestions
          4. Performance considerations
          5. Any questions or unclear parts

          Format your response in GitHub-flavored Markdown with clear sections.
          Be constructive and helpful."""

          # Get review from Gemini
          try:
              response = model.generate_content(prompt)
              review_text = response.text

              # Save review to file
              with open('gemini_review.md', 'w') as f:
                  f.write(review_text)

              print("Review generated successfully")
          except Exception as e:
              print(f"Error generating review: {e}")
              with open('gemini_review.md', 'w') as f:
                  f.write(f"⚠️ Failed to generate Gemini review: {str(e)}")
              exit(1)
          PYTHON_EOF

          # Run the review script
          python gemini_review.py

      - name: Post review comment
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Add header to review
          cat > final_review.md << 'EOF'
          ## 🔎 Gemini Code Review

          EOF

          cat gemini_review.md >> final_review.md

          # Add footer
          cat >> final_review.md << 'EOF'

          ---
          *Reviewed by Gemini 2.0 Flash (Experimental)*
          EOF

          # Post as PR comment
          gh pr comment $PR_NUMBER --body-file final_review.md

      - name: Handle review failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          gh pr comment $PR_NUMBER --body "⚠️ Gemini auto-review failed. Please check the workflow logs for details."
