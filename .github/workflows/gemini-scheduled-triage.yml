name: '📋 Gemini Scheduled Issue Triage'

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  triage:
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'read'
      pull-requests: 'read'
    uses: 'jhw7500/ci-workflows/.github/workflows/gemini-scheduled-triage.yml@v1'
    secrets: 'inherit'
