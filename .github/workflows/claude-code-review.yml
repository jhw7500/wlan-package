name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: '\1v1.10'
    with:
      pr_number: '${{ github.event.pull_request.number }}'
    secrets: 'inherit'
