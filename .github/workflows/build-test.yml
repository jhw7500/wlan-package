name: Build and Test

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.c'
      - '**.cpp'
      - '**.cc'
      - '**.h'
      - '**.hpp'
      - '**.hh'
      - 'Makefile'
      - 'build.sh'
      - 'dist/**'
      - 'wlan-bridge/**'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.c'
      - '**.cpp'
      - '**.cc'
      - '**.h'
      - '**.hpp'
      - '**.hh'
      - 'Makefile'
      - 'build.sh'
      - 'dist/**'
      - 'wlan-bridge/**'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if disabled'
        type: boolean
        default: false

jobs:
  build:
    name: Build Package
    if: ${{ github.event.inputs.force_run == 'true' || vars.BUILD_TEST_ENABLED != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Shell syntax check
        run: |
          set -euo pipefail

          bash -n build.sh
          bash -n dist/wlan/DEBIAN/preinst
          bash -n dist/wlan/DEBIAN/postinst
          bash -n dist/wlan/DEBIAN/prerm
          bash -n dist/wlan/DEBIAN/postrm
          bash -n dist/wlan/DEBIAN/config

      - name: Init submodules (optional)
        id: submodules
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SUBMODULE_TOKEN:-}" ]; then
            echo "submodules=false" >> "$GITHUB_OUTPUT"
            echo "## Build Package" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped: missing SUBMODULE_TOKEN (required to fetch private submodule wlan-bridge)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::add-mask::${SUBMODULE_TOKEN}"
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"

          git submodule update --init --recursive
          echo "submodules=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.submodules.outputs.submodules == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpcap-dev \
            jq \
            dpkg-dev

      - name: Verify wlan-bridge submodule
        if: steps.submodules.outputs.submodules == 'true'
        run: |
          if [ ! -d "wlan-bridge/dumb" ]; then
            echo "Error: wlan-bridge submodule not properly initialized"
            exit 1
          fi

      - name: Build wlan-bridge (host build only)
        if: steps.submodules.outputs.submodules == 'true' && runner.arch == 'X64'
        run: |
          set -euo pipefail
          make -C wlan-bridge/dumb release
          make -C wlan-bridge/dumb debug

      - name: Run build script
        if: steps.submodules.outputs.submodules == 'true' && runner.arch == 'ARM64'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify build artifacts
        if: steps.submodules.outputs.submodules == 'true' && runner.arch == 'ARM64'
        run: |
          if [ ! -f release/wlan.deb ]; then
            echo "Error: wlan.deb not found in release/"
            exit 1
          fi

          dpkg-deb -I release/wlan.deb
          dpkg-deb -c release/wlan.deb | grep -E "(dumb|config.json|postinst|postrm|prerm)"
          dpkg-deb -c release/wlan.deb | grep "usr/local/wlan-bridge/dumb/dumb" || exit 1
          dpkg-deb -c release/wlan.deb | grep "usr/local/wlan-bridge/dumb/dumb-tpacket" || exit 1
          dpkg-deb -c release/wlan.deb | grep "usr/local/etc/config.json" || exit 1

      - name: Validate config.json
        if: steps.submodules.outputs.submodules == 'true' && runner.arch == 'ARM64'
        run: |
          dpkg-deb -x release/wlan.deb /tmp/wlan-extract
          if [ -f /tmp/wlan-extract/usr/local/etc/config.json ]; then
            jq empty /tmp/wlan-extract/usr/local/etc/config.json
            echo "config.json is valid JSON"
          else
            echo "Error: config.json not found in package"
            exit 1
          fi

      - name: Verify DEBIAN scripts
        if: steps.submodules.outputs.submodules == 'true' && runner.arch == 'ARM64'
        run: |
          dpkg-deb -e release/wlan.deb /tmp/wlan-debian
          if [ ! -f /tmp/wlan-debian/postinst ]; then
            echo "Error: postinst not found"
            exit 1
          fi
          if [ ! -f /tmp/wlan-debian/postrm ]; then
            echo "Error: postrm not found"
            exit 1
          fi
          if [ ! -f /tmp/wlan-debian/prerm ]; then
            echo "Error: prerm not found"
            exit 1
          fi

      - name: Upload build artifacts
        if: steps.submodules.outputs.submodules == 'true' && runner.arch == 'ARM64'
        uses: actions/upload-artifact@v4
        with:
          name: wlan-package
          path: |
            release/*.deb
            release/*.tar
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${RUNNER_ARCH}" != "ARM64" ]; then
            echo "Skipped: package build is not executed on non-ARM64 runners." >> $GITHUB_STEP_SUMMARY
            echo "(This workflow still validates shell syntax and can build wlan-bridge natively on X64.)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ -f release/wlan.deb ]; then
            echo "Package built successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Package Info" >> $GITHUB_STEP_SUMMARY
            dpkg-deb -I release/wlan.deb | grep -E "(Package|Version|Architecture)" >> $GITHUB_STEP_SUMMARY || true
          else
            echo "Package build failed" >> $GITHUB_STEP_SUMMARY
          fi
