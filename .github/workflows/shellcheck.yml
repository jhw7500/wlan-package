name: ShellCheck

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.sh'
      - '**/postinst'
      - '**/postrm'
      - '**/prerm'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.sh'
      - '**/postinst'
      - '**/postrm'
      - '**/prerm'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if disabled'
        type: boolean
        default: false

jobs:
  shellcheck:
    name: ShellCheck Analysis
    if: ${{ github.event.inputs.force_run == 'true' || vars.SHELLCHECK_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck (focused)
        run: |
          set -euo pipefail

          # Scope: only packaging scripts we own and maintain.
          files=(
            build.sh
            dist/wlan/DEBIAN/preinst
            dist/wlan/DEBIAN/postinst
            dist/wlan/DEBIAN/prerm
            dist/wlan/DEBIAN/postrm
            dist/wlan/DEBIAN/config
          )

          # Only fail on ShellCheck errors (avoid blocking PR on existing warnings).
          shellcheck -x -s bash -S error -f gcc "${files[@]}"

      - name: Summary
        if: always()
        run: |
          echo "## ShellCheck Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ShellCheck analysis completed for all shell scripts and DEBIAN maintainer scripts." >> $GITHUB_STEP_SUMMARY
