name: OpenCode Auto PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: opencode-auto-review

  opencode-review:
    needs: check-enabled
    if: >-
      needs.check-enabled.outputs.enabled == 'true' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # id-token 없음(의도) — v1.34 부터 이 리뷰는 OIDC 교환 대신 GITHUB_TOKEN 을 쓴다.
      # 캘러가 남겨두면 재사용 워크플로우가 실수로 다시 요구할 때 조용히 통과한다.
      # 자동 리뷰는 코드를 쓰지 않으므로 contents 는 read 로 고정.
      contents: read
      pull-requests: write
      issues: write
    uses: jhw7500/automation/.github/workflows/opencode-auto-review.yml@v1.34
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit
