name: '🔀 Gemini Dispatch'

on:
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  pull_request:
    types:
      - 'opened'
  issues:
    types:
      - 'opened'
      - 'reopened'
  issue_comment:
    types:
      - 'created'

defaults:
  run:
    shell: 'bash'

jobs:
  dispatch:
    uses: 'jhw7500/automation/.github/workflows/gemini-dispatch.yml@v1.6'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    secrets: inherit
