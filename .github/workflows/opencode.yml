name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@72e0cfad8020a1fe40352b70ddb6438791c58f00
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
