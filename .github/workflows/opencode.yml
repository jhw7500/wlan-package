name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@3d92ddb5d66f8be2f69815719bb97102912ea96a
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
