name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@eb460b7e547a85f831820f8f25d30f134b2c6254
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
