name: zz Verify App Token (temp)

# 일회성 검증용 — vars.APP_ID(2523091) ↔ secrets.APP_PRIVATE_KEY 매칭 확인.
# create-github-app-token 발급 성공 시 job success, 불일치/미설치 시 step 실패.
# 검증 후 삭제 예정.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: t
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # ratchet:actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Report
        env:
          TOK: ${{ steps.t.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "${TOK:-}" ]; then
            echo "::notice::APP_TOKEN_OK — APP_ID(${{ vars.APP_ID }}) <-> APP_PRIVATE_KEY 매칭 성공, App 설치 확인"
            echo "RESULT=SUCCESS"
          else
            echo "::error::APP_TOKEN_FAIL — 토큰 미발급 (ID/key 불일치 또는 App 미설치)"
            echo "RESULT=FAIL"
            exit 1
          fi
