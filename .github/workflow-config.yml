# GitHub Actions Workflow Configuration
#
# This file controls enable/disable toggles for shared workflows.
# Workflows default to enabled if this file is missing.

# Shared workflow version pin for jhw7500/automation.
#
# NOTE: GitHub Actions does not allow dynamic refs in `uses: ...@ref`, so this value
# is used by a repo automation workflow that opens a PR updating all `uses:` refs.
automation_ref: v1.14
# Global review behavior.
# - manual triggers (e.g. @gemini-cli /review, @claude) should keep working regardless.
# - set review.auto=false to disable automatic PR reviews.
review:
  auto: true
workflows:
  # Repo-specific
  shellcheck:
    enabled: true
    description: "Shell script static analysis"

  build-test:
    enabled: true
    description: "Build and test the package"

  # Shared Gemini workflows
  gemini-dispatch:
    enabled: true
    description: "Central dispatcher for Gemini commands"

  gemini-invoke:
    enabled: true
    description: "General Gemini CLI invocation"

  gemini-review:
    enabled: true
    description: "PR code review with Gemini"

  gemini-triage:
    enabled: true
    description: "Issue triage and labeling"

  gemini-auto-review:
    enabled: true
    description: "Automatic PR review with Gemini"

  gemini-scheduled-triage:
    enabled: false
    description: "Scheduled issue triage (disabled to avoid hourly runs)"

  # Shared Claude workflows
  claude:
    enabled: true
    description: "Claude AI integration"

  claude-code-review:
    enabled: true
    description: "Claude automatic PR review"
