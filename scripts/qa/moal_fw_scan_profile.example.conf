# Trusted Bash run-config for moal_fw_scan_profile_controller.sh.
# Copy this file into a dated artifact directory and pin EXPECTED_* hashes for
# each driver/FW revision before a destructive board run.

PROFILE_NAME="example-ant-split"
IFACE="mlan0"
SSID="qa-scan-net"
STATION_IP="192.0.2.100"
GW="192.0.2.1"

CONF_REL="cts/wifi_mod_para.conf"
CONF="/lib/firmware/cts/wifi_mod_para.conf"
JSON="/usr/local/etc/wifi_init_conf.json"
WPA_CONF="/etc/wpa_supplicant/wpa_supplicant-mlan0.conf"
MLAN_KO="/opt/wlan/driver/mlan_imx93.ko"
MOAL_KO="/opt/wlan/driver/moal_imx93.ko"
FW="/lib/firmware/cts/sd9098_wlan_v1.bin"
MLANUTL="/usr/local/bin/mlanutl"
TXPWR_CONF="/lib/firmware/cts/txpwrlimit_cfg_9098.conf"
THERMAL_CONF="/lib/firmware/cts/config/debug.conf"
FW_LIB="/usr/local/scripts/wifi_fw_config_lib.sh"

MOAL_ARGS=(
    "mod_para=cts/wifi_mod_para.conf"
    "tx_work=0"
    "bridge_mode=1"
    "bridge_debug=0"
    "bridge_wlan_idx=0"
    "bridge_keepalive_ms=1"
    "bridge_keepalive_idle_ms=20"
    "bridge_local_hairpin=0"
    "wq_sched_policy=1"
    "wq_sched_prio=45"
)

# A/B: TX-power/thermal and radio-default replay.
APPLY_AB=0

# Request independent Tx/Rx bitmaps. Empty ANT_RX means Rx=Tx. Expected
# physical values default to the request, but can be overridden when a known
# driver/FW pair normalizes the physical mode. EXPECTED_USER_HTSTREAM is
# optional; when set, the matching utility must print user_htstream in antcfg
# GET output and the controller verifies it independently.
APPLY_ANTCFG=1
ANT_TX="0x303"
ANT_RX="0x101"
EXPECTED_ANT_TX="0x303"
EXPECTED_ANT_RX="0x101"
EXPECTED_USER_HTSTREAM=""

# These use the frozen JSON through wifi_fw_config_lib.sh when enabled.
APPLY_RATE=0
APPLY_MCS=0

# `--describe` accepts this template. `--validate-profile` and destructive
# execution reject it until every applicable hash is pinned for the board image.
EXPECTED_MLAN_SHA=""
EXPECTED_MOAL_SHA=""
EXPECTED_FW_SHA=""
EXPECTED_CONF_SHA=""
EXPECTED_JSON_SHA=""
EXPECTED_WPA_SHA=""
EXPECTED_MLANUTL_SHA=""
EXPECTED_FW_LIB_SHA=""
EXPECTED_TXPWR_SHA=""
EXPECTED_THERMAL_SHA=""
