# vhld.conf - VHL Protocol Daemon Configuration

# UDP listen port
PORT=50000

# Bind interface (wired)
BIND_IFACE=eth0

# Device info (for Get Device Info response)
VENDOR_NAME=Cantops
DEVICE_MODEL=CTS-WLAN-01
HW_VERSION=1.0
SERIAL_NUMBER=CTS000001

# Wireless interface
WLAN_IFACE=mlan0

# Roaming SNR threshold (dB)
ROAM_SNR_THRESHOLD=20
