# admin 은 상위 툴의 FTP 제어 전용 계정이다 — vsftpd 로컬 로그인과
# /opt/ftpcmd/bin 디스패치(rst/ifcup/ifcdown)가 그 계정의 용도다.
# 비밀번호가 상위 툴 규격으로 고정된 값이라 SSH 셸까지 열어두면 알려진
# 자격증명만으로 uid 1000 셸을 얻는 경로가 된다. FTP 경로는 그대로 두고
# SSH 만 막는다.
#
# 로그인 셸(/bin/sh)은 바꾸지 않는다. nologin 으로 바꾸는 방식은 vsftpd 의
# pam_shells 가 admin 을 거부하게 만들어 /etc/shells(base-files 소유)까지
# 함께 고쳐야 하고, 이미 admin 이 있는 기기에는 postinst 의 계정 생성 가드에
# 막혀 적용되지 않는다. DenyUsers 는 계정 존재 여부와 무관하게 걸리고
# 시리얼 콘솔 복구 경로도 그대로 남는다.
#
# sshd 는 이 보드에서 socket-activated 다(sshd.socket + sshd@.service;
# sshd.service 는 not-found). 연결마다 설정을 새로 읽으므로 reload/restart
# 없이 다음 연결부터 적용되고, 설치 중 기존 세션도 끊기지 않는다.
DenyUsers admin
