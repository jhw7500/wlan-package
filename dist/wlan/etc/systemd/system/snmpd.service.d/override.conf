# snmpd(net-snmp)를 wifi 스택 라이프사이클에 편입하는 drop-in override.
#
# 배경: snmpd 는 배포판 제공 유닛을 재사용하며 wifi_init_conf.json 의 .snmp.enabled
# 토글로 wifi_apply_enabled.sh 가 enable/disable, wifi_services.sh 가 start 한다.
# 그러나 다른 관리 데몬(wifi_logger@, wifi_roam@ 등)은 PartOf=wifi_init.service 로
# wifi_init 정지/재시작 시 함께 정지되는데, 배포판 snmpd.service 에는 이 관계가 없어
# .snmp.enabled=false 로 opt-out 후에도 wifi_init 재시작만으로는 snmpd(및 UDP 161)가
# 내려가지 않았다. 본 drop-in 으로 다른 관리 데몬과 동일한 정지 전파를 부여한다.
#
# 시작은 여전히 wifi_services.sh 가 enable 된 경우에만 담당한다(PartOf 는 start 를
# 유발하지 않고 stop/restart 만 전파). 배포판 유닛의 WantedBy=multi-user.target 은 유지.
[Unit]
PartOf=wifi_init.service
