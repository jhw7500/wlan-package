# snmpd(net-snmp)를 wifi 스택 라이프사이클에 편입하는 drop-in override.
#
# 배경: snmpd 는 배포판 제공 유닛을 재사용하며, 기동/정지는 wifi_init_conf.json 의
# .snmp.enabled 토글로 wifi_apply_enabled.sh(enable/disable) + wifi_services.sh(start)가
# 관리한다. 아래 두 지시자로 다른 관리 데몬과 동일한 "wifi_init 정지 시 함께 정지" +
# "wifi_init 이후 기동" 동작을 부여한다.
#
# StopPropagatedFrom: wifi_init.service 가 정지/재시작될 때 snmpd 도 함께 정지된다.
#   PartOf 대신 이것을 쓰는 이유 — PartOf 는 '재시작'도 전파해, .snmp.enabled=false 로
#   정지돼 있던 snmpd 를 wifi_init 재시작 시 강제 기동(UDP 161 노출)시킨다. StopPropagatedFrom
#   은 '정지'만 전파하므로, 재시작 후 실제 기동 여부는 wifi_services.sh 가 .snmp.enabled 로
#   올바르게 결정한다(opt-out 유지).
# After: snmpd 가 배포판 WantedBy=multi-user.target 로 부팅 시 wifi_init 초기화(네트워크/IP/
#   설정 복사·로거 기동) 완료 전 병렬 기동돼 빈 데이터를 노출하는 레이스를 방지(순서만 강제,
#   Requires 아님 — wifi_init 실패 시에도 기동 가능).
[Unit]
StopPropagatedFrom=wifi_init.service
After=wifi_init.service
