# /etc/snmp/snmpd.local.conf: snmpd reads it after /etc/snmp/snmpd.conf and its
# values win (#464).  The package rewrites snmpd.conf on every install but copies
# this template only when the file is missing or empty, so the values applied with
# FTP "quote wconfig" (SNMP_COMMUNITY, SNMP_SYSCONTACT, SNMP_SYSLOCATION,
# SNMP_SYSNAME) survive upgrades.  A factory reset restores this template.
# Without a sys* line snmpd uses snmpd.conf's sysLocation/sysContact and the host
# name as sysName.
rocommunity public  default
