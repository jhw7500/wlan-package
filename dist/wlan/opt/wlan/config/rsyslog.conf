# if you experience problems, check
# http://www.rsyslog.com/troubleshoot for assistance

# rsyslog v3: load input modules
# If you do not load inputs, nothing happens!
# You may need to set the module load path if modules are not found.
#
# Ported from debian's sysklogd.conf

$template myformat, "%timegenerated:1:10:date-rfc3339% %timegenerated:12:23:date-rfc3339% %programname%[%syslogpriority-text%]%msg%\n"
$ActionFileDefaultTemplate myformat

$ModLoad immark   # provides --MARK-- message capability
$ModLoad imuxsock # provides support for local system logging (e.g. via logger command)
$ModLoad imklog   # kernel logging (formerly provided by rklogd)

:omusrmsg:MarkMessagePeriod 3600

#
# Set the default permissions
#
$FileOwner root
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022

#if $programname == 'wpa_supplicant' then {
#    if $msg contains 'mlan0:' then action(type="omfile" file="/var/log/cantops/wpa/mlan0/wpa.log" template="myformat")
#    else if $msg contains 'mlan1:' then action(type="omfile" file="/var/log/cantops/wpa/mlan1/wpa.log" template="myformat")
#    stop
#}

# SME:·Associated with·timed out(#459): 인증 무응답(SME: Authentication timed out), 연결 응답
# 미수신(SME: Association timed out), EAPOL 미완료(Authentication with ... timed out.)를 구분한다.
if $programname == 'wpa_supplicant' and (
    $msg contains 'CTRL-EVENT' or
    $msg contains 'Trying to associate' or
    $msg contains 'Event' or
    $msg contains 'State' or
    $msg contains 'FT:' or
    $msg contains 'WPA: RX message' or
    $msg contains 'WPA: Sending EAPOL' or
    $msg contains 'connect threshold' or
    $msg contains 'connect_threshold' or
    $msg contains_i 'roam' or
    $msg contains 'Considering connect' or
    $msg contains_i 'reason' or
    $msg contains 'SME:' or
    $msg contains 'Associated with' or
    $msg contains 'timed out'
) then {
    if $msg contains 'mlan0:' then action(type="omfile" file="/var/log/cantops/wpa/mlan0/wpa.log" template="myformat")
    else if $msg contains 'mlan1:' then action(type="omfile" file="/var/log/cantops/wpa/mlan1/wpa.log" template="myformat")
    # 원격 syslog(#482): quote wconfig LOG_FUNC·LOG_SERVER가 쓰는 파일이 있으면 wpa.log에 쓴 줄을
    # 보낸다. 파일이 없으면 보내지 않는다. 아래 $IncludeConfig는 이 블록의 stop 뒤라 쓸 수 없고,
    # .conf가 아니어야 그 glob에 다시 잡히지 않는다.
    if $msg contains 'mlan0:' or $msg contains 'mlan1:' then {
        include(file="/etc/rsyslog.d/wpa-remote.inc" mode="optional")
    }
    stop
}

if $programname == 'wpa_supplicant' then {
    #if not ($msg contains 'EAPOL: EAP Session-Id not available') then action(type="omfile" file="/var/log/cantops/wpa/wpa.log" template="myformat")
    stop
}

if re_match($programname, "^wifi_") then {
    action(type="omfile" file="/var/log/cantops/logger.log" template="myformat")
    stop
}

